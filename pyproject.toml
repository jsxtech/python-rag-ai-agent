[project]
name = "python-rag-ai-agent"
version = "0.1.0"
description = "A minimal Retrieval-Augmented Generation agent using LangChain and OpenAI"
requires-python = ">=3.11"
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"rag_agent.py" = ["E402"]
